name: Campus Radar CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Commit refreshed dependency lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package lockfile [skip ci]"
            git push
          fi
      - name: Check migration scripts
        run: node --check scripts/bootstrap-admin.mjs && node --check scripts/migrate-d1-to-supabase.mjs
      - name: Build Next.js application
        run: npm run build
      - name: Validate Cloudflare OpenNext build
        run: npx opennextjs-cloudflare build
