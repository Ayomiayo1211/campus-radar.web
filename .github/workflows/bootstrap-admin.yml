name: Bootstrap Campus Radar Super Admin

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Campus Radar]
    types: [completed]

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create or update the initial Super Admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wypsdhgrzkvtbfwuwgre.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          test -n "$SUPABASE_SECRET_KEY" || (echo "Missing SUPABASE_SECRET_KEY" && exit 1)
          if [ -z "$ADMIN_NAME" ] || [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::notice::Admin bootstrap skipped. Add ADMIN_NAME, ADMIN_EMAIL and ADMIN_PASSWORD to the production environment secrets to provision the initial administrator."
            exit 0
          fi
          node scripts/bootstrap-admin.mjs
